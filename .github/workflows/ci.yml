name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest --cov=unitconv --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage table in job summary
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = Path("coverage.json")
          if not report.exists():
              raise SystemExit(0)

          data = json.loads(report.read_text())
          print(f"## Coverage · Python {os.environ['MATRIX_PYTHON']} · {os.environ['MATRIX_OS']}")
          print()
          print("| File | Statements | Missed | Cover |")
          print("| --- | ---: | ---: | ---: |")
          for name, info in sorted(data["files"].items()):
              s = info["summary"]
              print(f"| `{name}` | {s['num_statements']} | {s['missing_lines']} | {s['percent_covered']:.1f}% |")
          t = data["totals"]
          print(f"| **Total** | **{t['num_statements']}** | **{t['missing_lines']}** | **{t['percent_covered']:.1f}%** |")
          PY
